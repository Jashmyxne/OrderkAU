<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=0.35, maximum-scale=3.0, user-scalable=yes">
    <title>Order kAU | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./style.css?v=2.0">
    <style>
        .brand-header-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
        }
        .brand-header-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.3));
        }
    </style>
</head>

<body>

    <main class="login-container">

        <div class="brand-header-box">
            <img class="brand-header-logo" src="https://i.pinimg.com/736x/61/86/80/6186807959022bcb20a529cde85fff94.jpg" alt="PHINMA AU Logo">
            <span class="brand-name" style="font-size: 22px; margin-bottom: 0;">ORDER kAU</span>
        </div>

        <h2 id="formTitle">Welcome!</h2>
        <p class="subtitle" id="formSubtitle">Log in to order from the campus canteen</p>

        <form id="authForm">

            <div class="input-group">
                <label for="userRole">Account Type</label>
                <select id="userRole" class="role-select" required>
                    <option value="student">Student Portal</option>
                    <option value="seller">Seller / Canteen Staff</option>
                </select>
            </div>

            <div class="input-group">
                <label for="email">PHINMA Email / Student Number</label>
                <input type="email" id="email" name="email" placeholder="username@phinmaed.com" autocomplete="email" required>
            </div>

            <div class="input-group password-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <button type="button" id="togglePasswordBtn" class="toggle-pwd-btn">SHOW</button>
                </div>
            </div>

            <div class="form-options" id="loginOptions">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe"> Remember Me
                </label>
                <a href="#" class="forgot-pass" id="forgotPassLink">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-login" id="submitBtn">
                LOG IN
            </button>

        </form>

        <div class="divider-text"><span>OR</span></div>

        <button type="button" class="btn-google-flat" id="googleBtn">
            <svg width="18" height="18" viewBox="0 0 18 18">
                <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.616z"/>
                <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
                <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
                <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
            </svg>
            Continue with Google (PHINMA Email)
        </button>

        <div class="extra-links">
            <p id="toggleAccountText">
                Don't have an account? 
                <a href="#" id="toggleAuthMode">Create an account</a>
            </p>
        </div>

        <div class="divider"></div>

        <footer>
            &copy; PHINMA Araullo University
            <br> Order kAU | All Rights Reserved
        </footer>

    </main>

    <script>
        let isSignUpMode = false;

        const authForm = document.getElementById('authForm');
        const formTitle = document.getElementById('formTitle');
        const formSubtitle = document.getElementById('formSubtitle');
        const submitBtn = document.getElementById('submitBtn');
        const toggleAccountText = document.getElementById('toggleAccountText');
        const loginOptions = document.getElementById('loginOptions');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');

        togglePasswordBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePasswordBtn.textContent = 'HIDE';
            } else {
                passwordInput.type = 'password';
                togglePasswordBtn.textContent = 'SHOW';
            }
        });

        toggleAccountText.addEventListener('click', function(e) {
            if (e.target && e.target.id === 'toggleAuthMode') {
                e.preventDefault();
                isSignUpMode = !isSignUpMode;

                if (isSignUpMode) {
                    formTitle.textContent = "Create Account";
                    formSubtitle.textContent = "Create an account to start ordering";
                    submitBtn.textContent = "SIGN UP";
                    loginOptions.style.display = 'none';
                    toggleAccountText.innerHTML = 'Already have an account? <a href="#" id="toggleAuthMode">Log in</a>';
                } else {
                    formTitle.textContent = "Welcome!";
                    formSubtitle.textContent = "Log in to order from the campus canteen";
                    submitBtn.textContent = "LOG IN";
                    loginOptions.style.display = 'flex';
                    toggleAccountText.innerHTML = 'Don\'t have an account? <a href="#" id="toggleAuthMode">Create an account</a>';
                }
            }
        });

        authForm.addEventListener('submit', function(event) {
            event.preventDefault();

            const role = document.getElementById('userRole').value;
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = passwordInput.value;

            if (!email.endsWith('@phinmaed.com')) {
                alert('Access Restricted: You must use an official @phinmaed.com email address.');
                return;
            }

            let registeredUsers = JSON.parse(localStorage.getItem('kAU_RegisteredUsers')) || [];

            if (isSignUpMode) {
                const existingUser = registeredUsers.find(user => user.email === email);

                if (existingUser) {
                    alert('An account with this email already exists! Please click "Log in" to sign in.');
                    return;
                }

                const displayName = email.split('@')[0].replace('.', ' ');
                const newUser = { email: email, password: password, name: displayName, role: role };
                
                registeredUsers.push(newUser);
                localStorage.setItem('kAU_RegisteredUsers', JSON.stringify(registeredUsers));

                alert('Account created successfully! You can now log in.');

                isSignUpMode = false;
                formTitle.textContent = "Welcome!";
                formSubtitle.textContent = "Log in to order from the campus canteen";
                submitBtn.textContent = "LOG IN";
                loginOptions.style.display = 'flex';
                toggleAccountText.innerHTML = 'Don\'t have an account? <a href="#" id="toggleAuthMode">Create an account</a>';

            } else {
                const userAccount = registeredUsers.find(user => user.email === email);

                if (!userAccount) {
                    alert("Account not found! You haven't created an account with this email yet. Please click 'Create an account' below to register first.");
                    return;
                }

                if (userAccount.password !== password) {
                    alert('Incorrect password! Please try again.');
                    return;
                }

                const userSession = { email: userAccount.email, name: userAccount.name, role: role };
                localStorage.setItem('orderkAUUser', JSON.stringify(userSession));

                if (role === 'seller') {
                    window.location.href = 'seller_dashboard.html';
                } else {
                    window.location.href = 'orderkAU_order.html';
                }
            }
        });

        document.getElementById('googleBtn').addEventListener('click', () => {
            alert('Please enter your @phinmaed.com email and password in the form above.');
        });

        document.getElementById('forgotPassLink').addEventListener('click', (e) => {
            e.preventDefault();
            alert('If you forgot your password, please create a new account or contact canteen support.');
        });
    </script>

</body>

</html>
